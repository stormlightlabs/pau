[workspace]
members = [
  "crates/core",
  "crates/agent",
  "crates/pi",
  "crates/cli",
  "crates/server",
  "crates/term",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stormlightlabs/pau"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.8", features = ["cors"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
