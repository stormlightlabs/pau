<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Checking active sessions · Pau prototype</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="styles/tokens.css" />
		<link rel="stylesheet" href="styles/icons.css" />
		<link rel="stylesheet" href="styles/app.css" />
		<script>
			// Apply the theme chosen on the index page (?theme= or saved choice).
			try {
				const theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('pau-prototype-theme');
				if (theme) document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
	</head>
	<body>
		<div class="app app--bare">
			<main class="splash" aria-live="polite">
				<div class="launch">
					<div class="launch__brand">
						<span class="brand-mark"><span class="icon i-pau-mark" aria-hidden="true"></span></span>
						<div>
							<strong class="launch__name">Pau</strong><span class="launch__tagline">Local coding workspace</span>
						</div>
					</div>
					<p class="launch__step">Launch 3 / 4</p>
					<h1>Checking active sessions</h1>
					<p class="launch__text">Two Pi sessions are still running.</p>
					<progress max="100" value="86" aria-label="Launch progress">86%</progress>
					<p class="launch__footer">local service · 127.0.0.1</p>
				</div>
			</main>
		</div>
	</body>
</html>
