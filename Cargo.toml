[workspace]
members = [
  "crates/core",
  "crates/agent",
  "crates/pi",
  "crates/cli",
  "crates/server",
  "crates/term",
  "apps/desktop/src-tauri",
  "packages/sandbox/native/denial-preload",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stormlightlabs/pau"
version = "0.7.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
cap-std = "4.0.3"
dirs = "6.0.0"
futures-util = "0.3.31"
getrandom = "0.3.4"
globset = "0.4.20"
ignore = "0.4.25"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde"] }
libc = "0.2.183"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
time = { version = "0.3.55", features = ["formatting"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.26.1", features = ["v4"] }
