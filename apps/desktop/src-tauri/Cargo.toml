[package]
name = "pau-desktop"
description = "Tauri desktop shell for Pau"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
pau-core = { path = "../../../crates/core" }
pau-server = { path = "../../../crates/server" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "~2.4.0"
tauri-plugin-opener = "2.5.5"
# `src/window_state.rs` mirrors this release's saved-state file format and its
# check that a window lies on a connected display. Recheck both before a bump.
tauri-plugin-window-state = "~2.4.1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
pau-agent = { path = "../../../crates/agent" }

[dev-dependencies]
tempfile = "3.27.0"
tokio-rusqlite.workspace = true
