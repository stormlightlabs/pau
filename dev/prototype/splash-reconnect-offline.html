<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pau lost its local connection · Pau prototype</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&amp;family=Overpass:wght@400;500;600&amp;display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="styles/tokens.css" />
		<link rel="stylesheet" href="styles/icons.css" />
		<link rel="stylesheet" href="styles/app.css" />
		<script>
			// Apply the theme chosen on the index page (?theme= or saved choice).
			try {
				const theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('pau-prototype-theme');
				if (theme) document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
	</head>
	<body>
		<div class="app app--bare">
			<div class="splash-layout">
				<header class="splash-bar">
					<span class="brand-mark"><span class="icon i-pau-mark" aria-hidden="true"></span></span><strong>Pau</strong
					><span class="status"
						><span class="dot tone-warning"></span><span class="muted">Local service unavailable</span></span
					>
				</header>
				<main class="splash">
					<section class="reconnect-card" role="alert" aria-labelledby="reconnect-title">
						<div class="reconnect-card__icon tone-warning">
							<span class="icon i-tabler-plug-connected-x" aria-hidden="true"></span>
						</div>
						<h1 id="reconnect-title">Pau lost its local connection</h1>
						<p>Agent and terminal processes may still be running. Reconnect before starting the same work again.</p>
						<dl>
							<div>
								<dt>Local API</dt>
								<dd class="tone-danger">not responding</dd>
							</div>
							<div>
								<dt>Last event</dt>
								<dd>12 seconds ago</dd>
							</div>
							<div>
								<dt>Active sessions</dt>
								<dd>2 before disconnect</dd>
							</div>
						</dl>
						<div class="button-row">
							<button class="button button--primary" type="button">
								<span class="icon i-tabler-refresh" aria-hidden="true"></span>Try again</button
							><a class="button" href="screens-diagnostics-default.html">Open diagnostics</a>
						</div>
					</section>
				</main>
			</div>
		</div>
	</body>
</html>
