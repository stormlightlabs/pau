<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved motion setting before first paint so a reduced-motion choice never flashes an animation.
			try {
				var motion = localStorage.getItem('pau.motion');
				if (motion === 'reduce' || motion === 'full') document.documentElement.dataset.motion = motion;
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
