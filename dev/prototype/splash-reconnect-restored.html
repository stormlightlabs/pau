<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Connection restored · Pau prototype</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400;600&amp;family=Overpass:wght@400;500;600&amp;display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="styles/tokens.css" />
		<link rel="stylesheet" href="styles/icons.css" />
		<link rel="stylesheet" href="styles/app.css" />
		<script>
			// Apply the theme chosen on the index page (?theme= or saved choice).
			try {
				const theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('pau-prototype-theme');
				if (theme) document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
	</head>
	<body>
		<div class="app app--bare">
			<div class="splash-layout">
				<header class="splash-bar">
					<span class="brand-mark"><span class="icon i-pau-mark" aria-hidden="true"></span></span><strong>Pau</strong
					><span class="status"
						><span class="dot tone-success"></span><span class="muted">Local service connected</span></span
					>
				</header>
				<main class="splash">
					<section class="reconnect-card" role="alert" aria-labelledby="reconnect-title">
						<div class="reconnect-card__icon tone-success">
							<span class="icon i-tabler-check" aria-hidden="true"></span>
						</div>
						<h1 id="reconnect-title">Connection restored</h1>
						<p>The workspace and both active sessions are available again.</p>
						<div class="button-row" style="padding-block-start: 4px">
							<a class="button button--primary" href="screens-dashboard-default.html"
								>Return to workspace<span class="icon i-tabler-arrow-right" aria-hidden="true"></span
							></a>
						</div>
					</section>
				</main>
			</div>
		</div>
	</body>
</html>
