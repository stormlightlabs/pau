name: Debug
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stormlightlabs/pau-ui exec playwright install --with-deps chromium
      - run: pnpm --filter @stormlightlabs/pau-ui exec vitest run --project components src/tests/ControlStates.svelte.test.ts -t "distinct colors"
