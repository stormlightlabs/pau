[workspace]
members = [
  "crates/core",
  "crates/agent",
  "crates/pi",
  "crates/cli",
  "crates/server",
  "crates/term",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stormlightlabs/pau"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
