[workspace]
members = [
  "crates/core",
  "crates/agent",
  "crates/pi",
  "crates/cli",
  "crates/server",
  "crates/term",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stormlightlabs/pau"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["ws"] }
futures-util = "0.3.31"
getrandom = "0.3.4"
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
semver = "1.0.28"
subtle = "2.6.1"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
